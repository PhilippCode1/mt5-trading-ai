[project]
name = "mt5-trading-ai"
version = "0.0.1"
description = "Herausgeloester Kern: Risiko- und Sperrschicht, Validierung, Doku-Tore."
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Eichfaelle des Programms NEUAUFBAU liegen in eigenen Dateien tests/eichfall_*.py
# (Plan Auftrag 1, Entscheidung 3); ohne diesen Eintrag sammelte pytest sie nicht.
python_files = ["test_*.py", "eichfall_*.py"]
filterwarnings = ["ignore::DeprecationWarning"]
# ``slow`` markiert die Faelle, die einen Unterprozess ueber die ganze Suite fahren
# (das Mutationstor). Sie laufen mit -- die Marke ist dafuer da, sie bei Bedarf
# gezielt abzuwaehlen, nicht dafuer, sie stillschweigend auszulassen.
markers = ["slow: faehrt einen Unterprozess ueber die Suite (Mutationstor)"]

# Ruff-Konfiguration bewusst identisch zum Altbestand (line-length 88, gleiche
# Regelauswahl, gleiche Test-Ausnahmen), damit "gruen im Alt" und "gruen im Neu"
# dasselbe bedeuten und kein Konfigurationsartefakt sind.
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["mt5_trading_ai", "tests", "tools"]
# PROGRAMM/eingang/ ist das Beleg-Archiv der Bewertung (fremde Pruefskripte,
# Rohausgaben), kein Code dieses Pakets -- wird nicht gelintet; ebenso die Belegskripte
# unter PROGRAMM/auftrag-*/belege/ (Messprotokolle, teils aus der Bewertung abgeleitet,
# E-013). PROGRAMM/hooks/ dagegen wird gelintet und typgeprueft.
extend-exclude = ["PROGRAMM/eingang", "PROGRAMM/auftrag-*/belege"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Tests: sys.path-Shims vor Imports (E402), lange Legacy-Zeilen (E501).
"tests/**" = ["E402", "E501"]

# Mypy strict gilt fuer das Paket ``mt5_trading_ai`` (Teil 8, Punkt 2). Aufruf:
# ``mypy --strict mt5_trading_ai``.
[tool.mypy]
python_version = "3.11"
strict = true
# ``MetaTrader5`` liegt nur auf Windows-Rechnern mit Terminal und ohne Typinformation.
# Der Stub unter stubs/ laesst den Import auf jedem Rechner gleich aufloesen -- die
# Linux-CI meldete sonst ``import-not-found`` in tools/live_betrieb.py (T6 "T",
# Beleg belege/03-nachstellung/03-mypy-linuxfall.txt).
mypy_path = "stubs"

[tool.black]
line-length = 88
target-version = ["py311"]


# Zweigdeckung, nicht Zeilendeckung (Stufe 8 des Dauerauftrags). Eine Zeilendeckung von
# 95 % kann heissen, dass jede if-Bedingung genau einmal gelaufen ist -- immer in
# dieselbe Richtung. Der Sinn einer Sperre liegt aber im ablehnenden Zweig.
[tool.coverage.run]
branch = true
source = ["mt5_trading_ai"]

[tool.coverage.report]
# Kein globales fail_under: das Tor urteilt JE DATEI (tools/zweigdeckung.py). Eine
# Gesamtzahl von 87 % kann eine Datei mit 99 % und eine mit 40 % bedeuten, und die mit
# 40 % ist die interessante.
show_missing = true
